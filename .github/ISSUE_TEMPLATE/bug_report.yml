name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Setup
      description: Hub type (split, join, bridge, bus), ports involved, baud rate, and the applications on each end.
      placeholder: "Split COM3 (USB GPS, 9600 8N1) into virtual COM20 and COM21, used by two navigation apps"
  - type: input
    id: version
    attributes:
      label: SerialLoom version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: input
    id: driver
    attributes:
      label: Driver status
      description: Settings > Virtual port driver, and the port's state under Virtual ports.
      placeholder: "SerialLoom driver: ready; COM20 ready"
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text
