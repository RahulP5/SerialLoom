name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  driver:
    name: Driver (UMDF, unsigned)
    # windows-2022 ships with the Windows Driver Kit preinstalled.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: drivers/serialloom-port

      # windows-drivers-rs (bindgen 0.71) needs LLVM 17.
      - name: Install LLVM 17
        run: choco install llvm --version=17.0.6 --allow-downgrade -y --no-progress

      - name: Clippy
        working-directory: drivers/serialloom-port
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo clippy -- -D warnings

      - name: Build and verify driver package
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: ./drivers/serialloom-port/package.ps1 -NoSign

      - uses: actions/upload-artifact@v4
        with:
          name: driver-package
          path: drivers/serialloom-port/target/release/package/

  app:
    name: App (lint, test, build)
    needs: driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: driver-package
          path: drivers/serialloom-port/target/release/package/

      - name: Fetch Microsoft-signed usbip-win2 files
        shell: pwsh
        run: ./scripts/fetch-usbip-win2.ps1 -InstallTemporarily

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: target/release/bundle/nsis/*.exe
