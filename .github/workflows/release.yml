name: Release

# Push a tag such as v0.1.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Microsoft-signed usbip-win2 files
        shell: pwsh
        run: ./scripts/fetch-usbip-win2.ps1 -InstallTemporarily

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Tests
        run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SerialLoom ${{ github.ref_name }}
          releaseBody: |
            **Virtual COM port manager for Windows** - create, pair, split, join and bridge serial ports with a live visual editor.

            ### What's new in 0.3.0
            - **Fixed: data lost when a program reads late.** Data sent to a virtual port while the program there was slow to read was dropped, and the port briefly showed as closed. Thanks to @ying-zi-pro for the detailed report (#14).
            - **Fixed: large writes cut short.** A program that wrote more than 256 KiB at once to a virtual port lost all but the last 256 KiB, and fast writes could lose data the same way. Writes now wait while the other side catches up, as with a busy USB adapter.
            - **A program that stops reading no longer holds anyone up for long:** data for it waits up to 2 seconds, then is dropped and counted. Data from a real serial port never waits: in a split, the other ports still get everything.
            - A port that is dropping data shows an amber *program not reading* note, which clears once data flows again (also as `warning` in the automation API).

            ### Highlights
            - Virtual COM ports that any program can open, with the COM numbers you choose (e.g. COM20)
            - Virtual null-modem pairs, port splitting and joining, and bridging serial ports to TCP
            - Live topology canvas with throughput, plus a traffic monitor (ASCII / hex)
            - Ports come back with the same numbers when SerialLoom starts; deleting a port removes it from Windows
            - Runs in the notification area: closing the window keeps ports open, *Quit SerialLoom* in the tray menu closes them
            - Shows the baud rate and framing each program chose on its virtual port
            - Light and dark themes (or follow Windows)
            - Scriptable: `serialloom-cli pair` gives a test run its own ports, with no administrator prompts

            ### Install
            Download **SerialLoom_*_x64-setup.exe** below and run it. Windows 10 (1803+) or Windows 11, x64. No test mode or extra drivers needed.

            ### Notes
            - The installer is not code-signed yet, so Windows SmartScreen may ask you to confirm: *More info > Run anyway*.
            - Virtual ports exist while SerialLoom is running (also when its window is closed).
            - Uses the bundled, Microsoft-signed [usbip-win2](https://github.com/vadimgrn/usbip-win2) virtual USB controller (BSD-2-Clause).
          releaseDraft: false
          prerelease: false
