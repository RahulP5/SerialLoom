name: Release

# Push a tag such as v0.1.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Microsoft-signed usbip-win2 files
        shell: pwsh
        run: ./scripts/fetch-usbip-win2.ps1 -InstallTemporarily

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Tests
        run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SerialLoom ${{ github.ref_name }}
          releaseBody: |
            **Virtual COM port manager for Windows** - create, pair, split, join and bridge serial ports with a live visual editor.

            ### What's new in 0.4.0
            - **SerialLoom in your language:** the app now speaks German, Spanish, Portuguese (Brazil), Russian, Simplified Chinese, Japanese and Korean, besides English. It follows the Windows display language; pick another in *Settings > Appearance > Language*. The installer and the tray menu follow too. Thanks to @zhulinghuanyu for the suggestion (#15).
            - The translations are new. If something reads wrong in your language, please open an issue with a better wording.
            - Some messages from Windows and the port driver are still shown in English.
            - **Virtual pairs now pass DTR across, like a null-modem cable:** each program's DTR shows up at the other port as DSR and DCD (carrier detect), with the matching `EV_DSR`/`EV_RLSD` events, and closing a port drops its DTR. Before, DSR and DCD were always on. A program that waits for DSR or DCD now waits until the program at the other port opens it with DTR on. Thanks to @duxincai for the detailed report (#17).
            - **New: [what differs from a classic serial port](https://github.com/RahulP5/SerialLoom/blob/main/docs/USB_PORTS.md#limitations)** on ports served by Windows' USB serial driver. With `ReadIntervalTimeout` set (pyserial's `inter_byte_timeout`), a read can return no data before the first byte arrives; use a total timeout only. CTS always reads on, and breaks do not reach the other port. Thanks to @duxincai for tracking this down (#16).

            ### Highlights
            - Virtual COM ports that any program can open, with the COM numbers you choose (e.g. COM20)
            - Virtual null-modem pairs, port splitting and joining, and bridging serial ports to TCP
            - Live topology canvas with throughput, plus a traffic monitor (ASCII / hex)
            - Ports come back with the same numbers when SerialLoom starts; deleting a port removes it from Windows
            - Runs in the notification area: closing the window keeps ports open, *Quit SerialLoom* in the tray menu closes them
            - Shows the baud rate and framing each program chose on its virtual port
            - Light and dark themes (or follow Windows)
            - In English, German, Spanish, Portuguese (Brazil), Russian, Simplified Chinese, Japanese and Korean
            - Scriptable: `serialloom-cli pair` gives a test run its own ports, with no administrator prompts

            ### Install
            Download **SerialLoom_*_x64-setup.exe** below and run it. Windows 10 (1803+) or Windows 11, x64. No test mode or extra drivers needed.

            ### Notes
            - The installer is not code-signed yet, so Windows SmartScreen may ask you to confirm: *More info > Run anyway*.
            - Virtual ports exist while SerialLoom is running (also when its window is closed).
            - Uses the bundled, Microsoft-signed [usbip-win2](https://github.com/vadimgrn/usbip-win2) virtual USB controller (BSD-2-Clause).
          releaseDraft: false
          prerelease: false
