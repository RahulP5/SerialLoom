name: Release

# Push a tag such as v0.1.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Microsoft-signed usbip-win2 files
        shell: pwsh
        run: ./scripts/fetch-usbip-win2.ps1 -InstallTemporarily

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Tests
        run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SerialLoom ${{ github.ref_name }}
          releaseBody: |
            **Virtual COM port manager for Windows** - create, pair, split, join and bridge serial ports with a live visual editor.

            ### What's new in 0.5.0
            Most of this release comes from @eld400 (#18, #19). Thank you!

            #### New: GPS simulator
            SerialLoom can now stand in for a GPS receiver, so you can test navigation and tracking software without hardware. When you create a connection or add an endpoint, choose **NMEA 0183 simulator** or **NMEA 2000 simulator**:
            - **NMEA 0183:** choose which sentences to send: `RMC`, `GGA`, `GLL`, `GSA`, `GSV` (satellites in view), `VTG`, `ZDA` and `HDT`, with the `GP` or `GN` talker ID and the current UTC time. **NMEA 2000** sends Actisense-format PGNs 126992 (time), 129025 (position), 129026 (course and speed), 129539 (DOPs) and 127250 (heading).
            - **Moving or fixed:** a moving receiver follows its course and speed from the start position; a fixed one stays put. Optional position noise makes the fix wander like a real receiver.
            - **Fix quality:** GPS, DGPS, RTK fixed or float, estimated, or no fix (to test how your software handles a lost signal), with satellites used, HDOP, VDOP, PDOP, altitude and magnetic variation.
            - **Change it while it runs:** select the connection, edit the values in the GPS panel and click *Apply*. Course, speed, fix, sentences and the rest change at once, and the receiver carries on from where it is. Automation can do the same with `updateSimulator`.
            - By default it starts at the Eiffel Tower and heads east at 5 knots, sending RMC, GGA and VTG once per second, as before.
            - Send it to a virtual COM port for programs that read a serial GPS, or to UDP or TCP for programs that listen on the network.

            #### New: UDP
            Connections can now send and receive **UDP** datagrams, the way many navigation and logging programs share NMEA data:
            - Receive only, send only, or both. Data goes out as raw bytes or as one NMEA 0183 sentence per datagram.
            - Bridge a serial device or a virtual port to UDP, or feed the GPS simulator to a program that listens on UDP.
            - A UDP endpoint listens on this PC only (`127.0.0.1`) unless you enter another address.

            #### Updating keeps your setup
            Installing a new version over an older one now updates it in place: your virtual ports keep their COM numbers, and your connections and settings stay. Before, the installer uninstalled the old version first, which removed all virtual ports and could delete the settings. This applies from this update on, including when you update from 0.4.0. If you uninstall SerialLoom but keep its settings and install it again, your virtual ports also get their old COM numbers back, so saved connections keep working.

            #### Also new
            - **Français:** SerialLoom is now available in French (#18).
            - **File replay:** play raw bytes, NMEA 0183 sentences or Actisense-format NMEA 2000 records from a file into a connection, at a set byte rate or with the recorded timing, once or in a loop.
            - **Traffic capture:** right-click a link in the topology for an *Interactive trace* window or *Record to file* (text, hex or both, with UTC timestamps). Captures stop after 10 minutes, cap each file at 128 MB and keep 20 GB free on the disk.
            - **Passive USB capture (optional):** watch a USB serial adapter's traffic with [USBPcap](https://desowin.org/usbpcap/), even while another program has the port open. Needs USBPcap installed and SerialLoom running as administrator.
            - **Back up and restore:** the *Backup* menu at the top right of the topology (*Export JSON*, *Import JSON*) saves and restores your connections, virtual ports and layout.
            - **Topology:** TCP links are drawn with live throughput, and *Flip horizontally* in the context menu mirrors a connection.
            - **A slow destination no longer delays the others:** each destination now has its own queue. A program still waits rather than losing data when the other side reads slowly; data from a real serial port or UDP is never held up.
            - **Settings:** the Save button now stays at the bottom of the page and turns amber while there are unsaved changes.

            ### Highlights
            - Virtual COM ports that any program can open, with the COM numbers you choose (e.g. COM20)
            - Virtual null-modem pairs, port splitting and joining, and bridging serial ports to TCP and UDP
            - GPS simulator (NMEA 0183 and NMEA 2000) for testing navigation software without a GPS receiver
            - Live topology canvas with throughput, plus a traffic monitor (ASCII / hex)
            - Ports come back with the same numbers when SerialLoom starts; deleting a port removes it from Windows
            - Runs in the notification area: closing the window keeps ports open, *Quit SerialLoom* in the tray menu closes them
            - Shows the baud rate and framing each program chose on its virtual port
            - Light and dark themes (or follow Windows)
            - In English, German, Spanish, French, Portuguese (Brazil), Russian, Simplified Chinese, Japanese and Korean
            - Scriptable: `serialloom-cli pair` gives a test run its own ports, with no administrator prompts

            ### Install
            Download **SerialLoom_*_x64-setup.exe** below and run it. Windows 10 (1803+) or Windows 11, x64. No test mode or extra drivers needed.

            ### Notes
            - The installer is not code-signed yet, so Windows SmartScreen may ask you to confirm: *More info > Run anyway*.
            - Virtual ports exist while SerialLoom is running (also when its window is closed).
            - Uses the bundled, Microsoft-signed [usbip-win2](https://github.com/vadimgrn/usbip-win2) virtual USB controller (BSD-2-Clause).
          releaseDraft: false
          prerelease: false
