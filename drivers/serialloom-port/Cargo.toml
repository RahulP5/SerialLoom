[package]
name = "serialloom_port"
description = "SerialLoom virtual serial port driver (UMDF 2)"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false

# Built on its own: it needs the Windows Driver Kit and LLVM, which the app does not.
[workspace]

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 25

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build = "0.5.1"

[dependencies]
serialloom-proto = { path = "../../crates/serialloom-proto" }
serialloom-port-logic = { path = "../../crates/serialloom-port-logic" }
wdk = "0.4.1"
wdk-sys = "0.5.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
